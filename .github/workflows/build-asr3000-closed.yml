name: Build ASR3000 (ImmortalWrt 25.12 / Linux 6.12 / MTK closed)

on:
  workflow_dispatch:
    inputs:
      passwall:
        description: "包含 luci-app-passwall"
        type: boolean
        default: false
      openclash:
        description: "包含 luci-app-openclash"
        type: boolean
        default: false
      smartdns:
        description: "包含 luci-app-smartdns"
        type: boolean
        default: false
      adguardhome:
        description: "包含 luci-app-adguardhome"
        type: boolean
        default: false
      docker:
        description: "包含 Docker + luci-app-dockerman（256MB 内存不建议）"
        type: boolean
        default: false
      samba4:
        description: "包含 Samba4 文件共享"
        type: boolean
        default: false
      wireguard:
        description: "包含 WireGuard"
        type: boolean
        default: false
      zerotier:
        description: "包含 ZeroTier"
        type: boolean
        default: false
      upnp:
        description: "包含 UPnP"
        type: boolean
        default: false
      sqm:
        description: "包含 SQM 队列"
        type: boolean
        default: false
      ttyd:
        description: "包含 ttyd 网页终端"
        type: boolean
        default: false
      argon:
        description: "包含 Argon 主题"
        type: boolean
        default: false
  push:
    tags:
      - "asr3000-closed-*"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: "25.12"
  HONK_FEED: https://github.com/QiuSimons/luci-app-honk.git
  OPT_PASSWALL: ${{ github.event.inputs.passwall }}
  OPT_OPENCLASH: ${{ github.event.inputs.openclash }}
  OPT_SMARTDNS: ${{ github.event.inputs.smartdns }}
  OPT_ADGUARDHOME: ${{ github.event.inputs.adguardhome }}
  OPT_DOCKER: ${{ github.event.inputs.docker }}
  OPT_SAMBA4: ${{ github.event.inputs.samba4 }}
  OPT_WIREGUARD: ${{ github.event.inputs.wireguard }}
  OPT_ZEROTIER: ${{ github.event.inputs.zerotier }}
  OPT_UPNP: ${{ github.event.inputs.upnp }}
  OPT_SQM: ${{ github.event.inputs.sqm }}
  OPT_TTYD: ${{ github.event.inputs.ttyd }}
  OPT_ARGON: ${{ github.event.inputs.argon }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libelf-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget bc cpio dwarves

      - name: Clone ImmortalWrt MT798x (25.12)
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "src-git honk $HONK_FEED" >> feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare files overlay
        run: |
          mkdir -p openwrt/files
          cp -a asr3000/files/. openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/*

      - name: Generate .config
        run: |
          cd openwrt
          cp ../asr3000/configs/asr3000.seed .config

          add_pkg() {
            for p in "$@"; do
              grep -q "^CONFIG_PACKAGE_${p}=y$" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
            done
          }

          [ "$OPT_PASSWALL" = "true" ] && add_pkg luci-app-passwall
          [ "$OPT_OPENCLASH" = "true" ] && add_pkg luci-app-openclash
          [ "$OPT_SMARTDNS" = "true" ] && add_pkg luci-app-smartdns smartdns
          [ "$OPT_ADGUARDHOME" = "true" ] && add_pkg luci-app-adguardhome adguardhome
          [ "$OPT_DOCKER" = "true" ] && add_pkg luci-app-dockerman dockerd containerd runc
          [ "$OPT_SAMBA4" = "true" ] && add_pkg luci-app-samba4 samba4-server
          [ "$OPT_WIREGUARD" = "true" ] && add_pkg luci-proto-wireguard kmod-wireguard wireguard-tools
          [ "$OPT_ZEROTIER" = "true" ] && add_pkg luci-app-zerotier zerotier
          [ "$OPT_UPNP" = "true" ] && add_pkg luci-app-upnp miniupnpd
          [ "$OPT_SQM" = "true" ] && add_pkg luci-app-sqm sqm-scripts
          [ "$OPT_TTYD" = "true" ] && add_pkg luci-app-ttyd ttyd
          [ "$OPT_ARGON" = "true" ] && add_pkg luci-theme-argon

          make defconfig

      - name: Prepare prebuilt honk-core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt

          if ! grep -q '^CONFIG_PACKAGE_honk=y' .config; then
            echo "honk 未选中，跳过"
            exit 0
          fi

          PKG_DIR="feeds/honk/honk"
          [ -f "$PKG_DIR/Makefile" ] || { echo "找不到 $PKG_DIR/Makefile"; exit 1; }

          VER=$(sed -n 's/^PKG_VERSION:=//p' "$PKG_DIR/Makefile" | head -n 1)
          REL=$(sed -n 's/^PKG_RELEASE:=//p' "$PKG_DIR/Makefile" | head -n 1)
          VER_DOT=${VER//\~/.}
          VER_TAG=${VER//\~/_}
          echo "honk 版本: $VER (r$REL)"

          TAG="honk_${VER_TAG}-r${REL}"
          ASSET="honk_${VER_DOT}-r${REL}_aarch64_generic-openwrt-24.10.8.ipk"
          URL="https://github.com/QiuSimons/luci-app-honk/releases/download/${TAG}/${ASSET}"

          if ! curl -fsSL --retry 3 --retry-delay 5 -o /tmp/honk.ipk "$URL"; then
            echo "直接下载失败，用 API 找同版本 asset"
            URL=$(gh api "repos/QiuSimons/luci-app-honk/releases?per_page=30" \
              --jq '.[] | .assets[]? | .browser_download_url' 2>/dev/null \
              | grep -F "$VER_DOT" | grep 'aarch64_generic' | grep '\.ipk$' | head -n 1)
            [ -n "$URL" ] || { echo "找不到 $VER 的 aarch64 包"; exit 1; }
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/honk.ipk "$URL"
          fi

          rm -rf /tmp/honk-extract && mkdir -p /tmp/honk-extract
          if tar -tzf /tmp/honk.ipk >/dev/null 2>&1; then
            tar -xzf /tmp/honk.ipk -C /tmp/honk-extract
          else
            ( cd /tmp/honk-extract && ar x /tmp/honk.ipk )
          fi

          DATA=$(find /tmp/honk-extract -name data.tar.gz | head -n 1)
          [ -n "$DATA" ] || { echo "包内没有 data.tar.gz"; exit 1; }
          tar -xzf "$DATA" -C /tmp/honk-extract

          BIN=$(find /tmp/honk-extract -type f -name honk-core | head -n 1)
          [ -n "$BIN" ] || { echo "包内没有 honk-core"; exit 1; }
          file "$BIN" | grep -q 'aarch64' || { echo "honk-core 不是 aarch64"; file "$BIN"; exit 1; }

          install -m 0755 "$BIN" "$PKG_DIR/files/honk-core.bin"
          rm -f "$PKG_DIR/files/honk-core.bin.stamp"
          echo "已放置预编译 honk-core"

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p output
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*asr3000*' -exec cp -v {} output/ \;
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asr3000-immortalwrt-25.12-closed
          path: output/*
          if-no-files-found: error

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
