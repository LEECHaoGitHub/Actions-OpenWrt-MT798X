name: 25.12-abt-asr3000

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: 25.12/mt7981-25.12.config
  DIY_P1_SH: 25.12/diy-part1.sh
  DIY_P2_SH: 25.12/diy-part2.sh
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Free disk space & init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
        sudo docker image prune --all --force

        sudo swapoff -a && sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

        sudo -E apt-get -yqq purge firefox snapd
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq install git curl jq patch gzip zstd binutils \
          clang llvm dwarves libbpf-dev libclang-dev pkg-config cmake lua5.4 \
          ripgrep build-essential libssl-dev libelf-dev bc flex bison \
          python3 xz-utils tar dos2unix libfuse-dev ca-certificates

        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

        sudo -E apt-get -yqq clean
        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER":"$USER" /workdir

        df -hT
        free -h

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom feeds (diy-part1.sh)
      run: |
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Load custom configuration (diy-part2.sh)
      run: |
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Load custom configuration (diy-partX.sh)
      run: |
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        if [ -f "$GITHUB_WORKSPACE/diy-partX.sh" ]; then
          chmod +x "$GITHUB_WORKSPACE/diy-partX.sh"
          cd openwrt
          "$GITHUB_WORKSPACE/diy-partX.sh"
        fi

    - name: Download packages
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        if make -j"$(nproc)"; then
          echo "多线程编译成功"
        elif make -j1; then
          echo "单线程编译成功"
        elif make -j1 V=s; then
          echo "单线程详细日志编译成功"
        else
          echo "编译失败"
          exit 1
        fi
        df -hT /

    - name: Collect firmware files
      run: |
        mkdir -p /workdir/firmware
        cd openwrt/bin/targets/*/*
        rm -rf packages
        for f in *-sysupgrade.itb *-recovery.itb *.manifest *.sha256sums; do
          if [ -f "$f" ]; then cp -v "$f" /workdir/firmware/; fi
        done
        cat > /workdir/release-notes.md <<'NOTES'
        ## ABT ASR3000 (MT7981) · immortalwrt 25.12

        - 机型：abt_asr3000（单机型，闭源 mt_wifi 驱动，128M Flash / 256M RAM）
        - 代理：仅 luci-app-honk（预编译 honk-core v0.1.0-beta.7 aarch64-musl-full）；dae / daede / momo / nikki / ssr-plus / openclash / homeproxy / passwall / docker 全部关闭
        - 默认管理地址：192.168.30.1

        ### 刷机（hanwckf bl-mt798x 的 uboot 吃不了 .itb，只认 tar/.bin）
        1. uboot 后台 192.168.1.1 进 TFTP 恢复模式，加载 *-initramfs-recovery.itb 进入临时系统；
        2. 浏览器打开临时系统，系统 → 备份与升级，刷 *-sysupgrade.itb（不要保留配置）。
        NOTES
        ls -lh /workdir/firmware/

    - name: Upload firmware (artifact)
      uses: actions/upload-artifact@v5
      with:
        name: abt-asr3000-${{ github.run_number }}
        path: /workdir/firmware/*
        if-no-files-found: error

    - name: Publish firmware to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd /workdir/firmware
        TAG="abt-asr3000-$(date +%Y%m%d-%H%M)"
        gh release create "$TAG" ./* \
          --repo "$GITHUB_REPOSITORY" \
          --title "ABT ASR3000 · immortalwrt 25.12 · ${TAG}" \
          --notes-file /workdir/release-notes.md
        echo "已发布 Release: $TAG"
